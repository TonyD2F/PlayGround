<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; }
  main { max-width: 640px; margin: 24px; padding: 40px 36px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  h1 { margin: 0 0 12px; font-size: 2.2rem; }
  p { margin: 0 0 16px; color: #cbd5e1; line-height: 1.6; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: #22c55e; color: #052e16; font-weight: 700; font-size: .8rem; margin-bottom: 16px; }
  button { padding: 12px 24px; font-size: 1rem; font-weight: 700; border: 0; border-radius: 10px; background: #38bdf8; color: #082f49; cursor: pointer; }
  button:hover { background: #7dd3fc; }
  #status { margin-top: 16px; min-height: 1.5em; color: #86efac; font-weight: 600; }
  @media (max-width: 480px) { main { padding: 28px 20px; } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<main>
  <span class="badge">Server is running</span>
  <h1>PlayGround</h1>
  <p>Static preview is live. This page confirms the startup server and screenshot capture pipeline work end to end.</p>
  <button id="play" type="button">Start</button>
  <div id="status" aria-live="polite">Ready to play.</div>
</main>
<script>
  document.getElementById('play').addEventListener('click', function () {
    document.getElementById('status').textContent = 'PlayGround started at ' + new Date().toLocaleTimeString() + '.';
  });
</script>
</body>
</html>
